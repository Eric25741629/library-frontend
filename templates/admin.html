<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖書館還書管理後台</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f7f6;
            --sidebar-width: 260px;
            --primary-color: #4361ee;
            --primary-hover: #3a53d0;
            --text-primary: #2b3674;
            --text-secondary: #a3aed0;
            --card-bg: #ffffff;
            --success-color: #05cd99;
            --warning-color: #ffb547;
            --danger-color: #ee5d50;
            --border-color: #e0e5f2;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-primary);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--card-bg);
            padding: 24px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 12px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            font-weight: 500;
        }

        .nav-item:hover, .nav-item.active {
            background-color: rgba(67, 97, 238, 0.05);
            color: var(--primary-color);
        }

        .nav-item i {
            font-size: 18px;
        }

        .sidebar-footer {
            margin-top: auto;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 30px;
            max-width: 1600px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .page-title h1 {
            font-size: 30px;
            font-weight: 700;
            margin: 0;
        }

        .page-title p {
            color: var(--text-secondary);
            margin: 5px 0 0;
            font-size: 14px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            font-size: 14px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }
        .btn-primary:hover { background-color: var(--primary-hover); }

        .btn-danger {
            background-color: rgba(238, 93, 80, 0.1);
            color: var(--danger-color);
        }
        .btn-danger:hover { background-color: rgba(238, 93, 80, 0.2); }

        .btn-warning {
             background-color: rgba(255, 181, 71, 0.1);
             color: #e69518;
        }
        .btn-warning:hover { background-color: rgba(255, 181, 71, 0.2); }


        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }

        .stat-icon {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .stat-info h3 {
            margin: 0;
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .stat-info p {
            margin: 5px 0 0;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* Content Grid */
        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        @media (max-width: 1200px) {
            .content-grid { grid-template-columns: 1fr; }
        }

        /* Card Styles */
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
            height: fit-content;
        }

        /* 修正 .card-header 對齊 */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        /* 修正 .header 對齊，確保標題和按鈕群組垂直置中 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0;
        }

        /* Table */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 12px 20px;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 14px;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 16px 20px;
            color: var(--text-primary);
            font-size: 14px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background-color: rgba(5, 205, 153, 0.1);
            color: var(--success-color);
        }

        .book-img {
            width: 40px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
        }

        /* Machine Controls */
        .control-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .control-btn {
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }

        .control-btn:hover {
            background-color: var(--bg-color);
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .control-btn i { font-size: 20px; margin-bottom: 4px; }

        .terminal-output {
            background-color: #1b254b;
            color: #fff;
            padding: 16px;
            border-radius: 12px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            min-height: 150px;
            max-height: 200px;
            overflow-y: auto;
            width: 100%;
            box-sizing: border-box;
            border: none;
            resize: vertical;
        }
        
        /* Settings Form */
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        .form-input {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            font-size: 14px;
            box-sizing: border-box;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .empty-state {
            text-align: center;
            padding: 40px 0;
            color: var(--text-secondary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); transition: transform 0.3s; }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; }
            .control-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <nav class="sidebar">
        <div class="logo">
            <i class="fas fa-book-reader"></i>
            <span>LibraryOS</span>
        </div>
        
        <div class="nav-menu">
            <a href="#" class="nav-item active" onclick="switchTab('dashboard')">
                <i class="fas fa-th-large"></i>
                <span>總覽儀表板</span>
            </a>
            <a href="#" class="nav-item" onclick="switchTab('machine')">
                <i class="fas fa-robot"></i>
                <span>機器控制</span>
            </a>
            <a href="#" class="nav-item" onclick="switchTab('settings')">
                <i class="fas fa-cog"></i>
                <span>系統設定</span>
            </a>
        </div>

        <div class="sidebar-footer">
            <a href="/" class="nav-item">
                <i class="fas fa-external-link-alt"></i>
                <span>返回前台</span>
            </a>
            <a href="/logout" class="nav-item" style="color: var(--danger-color);">
                <i class="fas fa-sign-out-alt"></i>
                <span>登出系統</span>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Dashboard View -->
        <div id="view-dashboard">
            <div class="header">
                <div class="page-title">
                    <h1>還書管理後台</h1>
                    <p>歡迎回來，管理員</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-warning" onclick="clearHistory()">
                        <i class="fas fa-eraser"></i> 清空紀錄
                    </button>
                    <button class="btn btn-danger" onclick="clearBox()">
                        <i class="fas fa-trash-alt"></i> 清空還書箱
                    </button>
                    <button class="btn btn-primary" onclick="fetchLogs()">
                        <i class="fas fa-sync-alt"></i> 重新整理
                    </button>
                </div>
            </div>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(67, 97, 238, 0.1); color: var(--primary-color);">
                        <i class="fas fa-book"></i>
                    </div>
                    <div class="stat-info">
                        <h3>目前書籍數量</h3>
                        <p><span id="total-count">0</span> / <span id="total-limit">20</span></p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(5, 205, 153, 0.1); color: var(--success-color);">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <div class="stat-info">
                        <h3>系統狀態</h3>
                        <p style="font-size: 18px;">運行正常</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: rgba(255, 181, 71, 0.1); color: #ffb547;">
                        <i class="fas fa-clock"></i>
                    </div>
                    <div class="stat-info">
                        <h3>今日還書總數</h3>
                        <p id="today-total">0</p>
                    </div>
                </div>
            </div>

            <!-- Table -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title" id="table-title">當前箱內列表</h2>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn btn-primary" id="btn-current-list" onclick="switchList('current')" style="padding: 6px 12px; font-size: 13px;">
                            <i class="fas fa-box-open"></i> 當前列表
                        </button>
                        <button class="btn btn-secondary" id="btn-history-list" onclick="switchList('history')" style="padding: 6px 12px; font-size: 13px; background: #e0e5f2; color: #5f6c7b;">
                            <i class="fas fa-history"></i> 歷史列表
                        </button>
                    </div>
                </div>
                <div class="table-container">
                    <table id="logs-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>書籍資訊</th>
                                <th>書籍編號</th>
                                <th>還書時間</th>
                                <th id="header-status-or-clear-time">狀態</th>
                            </tr>
                        </thead>
                        <tbody id="logs-body">
                            <!-- JS will populate -->
                        </tbody>
                    </table>
                    <div id="empty-message" class="empty-state" style="display: none;">
                        <i class="fas fa-inbox" style="font-size: 48px; margin-bottom: 16px; opacity: 0.3;"></i>
                        <p>目前尚無紀錄</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Machine Control View -->
        <div id="view-machine" style="display: none;">
            <div class="header">
                <div class="page-title">
                    <h1>機器控制中心</h1>
                    <p>直接發送指令控制硬體設備</p>
                </div>
            </div>

            <div class="content-grid">
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">快速指令</h2>
                    </div>
                    <div class="control-grid" style="grid-template-columns: repeat(4, 1fr);">
                        <button class="control-btn" onclick="sendMachineCommand('dep1')">
                            <i class="fas fa-power-off" style="color: var(--success-color);"></i> 電源開啟
                        </button>
                        <button class="control-btn" onclick="sendMachineCommand('dep0')">
                            <i class="fas fa-power-off" style="color: var(--danger-color);"></i> 電源關閉
                        </button>
                        <button class="control-btn" onclick="sendMachineCommand('homing')">
                            <i class="fas fa-home"></i> 回原點
                        </button>
                        <button class="control-btn" onclick="sendMachineCommand('state')">
                            <i class="fas fa-info-circle"></i> 查詢狀態
                        </button>
                        <button class="control-btn" onclick="sendMachineCommand('open')">
                            <i class="fas fa-door-open"></i> 開門
                        </button>
                        <button class="control-btn" onclick="sendMachineCommand('close')">
                            <i class="fas fa-door-closed"></i> 關門
                        </button>
                        <button class="control-btn" onclick="sendMachineCommand('put1')">
                            <i class="fas fa-box"></i> 分類箱 1
                        </button>
                        <button class="control-btn" onclick="sendMachineCommand('put2')">
                            <i class="fas fa-box-open"></i> 分類箱 2
                        </button>
                    </div>
                    
                    <div style="margin-top: 24px; display: flex; gap: 12px;">
                        <input type="text" id="custom-cmd" class="form-input" placeholder="輸入自訂指令 (例如: opbm1)">
                        <button class="btn btn-primary" onclick="sendCustom()">發送指令</button>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">終端機回應</h2>
                        <button class="btn btn-warning" style="padding: 4px 8px; font-size: 12px;" onclick="document.getElementById('machine-response').value=''">清除</button>
                    </div>
                    <textarea id="machine-response" class="terminal-output" readonly>等待指令...</textarea>
                </div>
            </div>
        </div>

        <!-- Settings View -->
        <div id="view-settings" style="display: none;">
            <div class="header">
                <div class="page-title">
                    <h1>系統設定</h1>
                    <p>調整系統參數與硬體連線</p>
                </div>
            </div>

            <div class="card" style="max-width: 600px;">
                <div class="form-group">
                    <label class="form-label">還書箱容量上限</label>
                    <input type="number" id="settings-limit" class="form-input" min="1" max="100" value="{{ config.max_return_limit if config is defined else 20 }}">
                </div>

                <div style="height: 1px; background: var(--border-color); margin: 30px 0;"></div>

                <h3 style="margin-bottom: 20px;">UART 硬體連線</h3>
                <div class="form-group">
                    <label class="form-label">序列埠 (Port)</label>
                    <input type="text" id="uart-port" class="form-input" placeholder="/dev/ttyUSB0">
                </div>
                <div class="form-group">
                    <label class="form-label">鮑率 (Baudrate)</label>
                    <input type="number" id="uart-baud" class="form-input" placeholder="38400">
                </div>

                <div style="margin-top: 30px; display: flex; justify-content: flex-end;">
                    <button class="btn btn-primary" onclick="saveSettings()">
                        <i class="fas fa-save"></i> 儲存設定
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" style="display:none; position:fixed; inset:0; background:rgba(255,255,255,0.8); z-index:9999; align-items:center; justify-content:center; backdrop-filter: blur(2px);">
        <div style="text-align:center;">
            <i class="fas fa-spinner fa-spin" style="font-size: 32px; color: var(--primary-color);"></i>
            <p style="margin-top: 12px; color: var(--text-secondary);">處理中...</p>
        </div>
    </div>

    <script>
        // Tab Switching
        function switchTab(tabName) {
            // Hide all views
            ['dashboard', 'machine', 'settings'].forEach(t => {
                document.getElementById(`view-${t}`).style.display = 'none';
            });
            // Show selected view
            document.getElementById(`view-${tabName}`).style.display = 'block';
            
            // Update active state in sidebar
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('active');
                if(el.getAttribute('onclick') && el.getAttribute('onclick').includes(tabName)) {
                    el.classList.add('active');
                }
            });
        }

        // Initialization
        let currentViewMode = 'current'; // 'current' or 'history'
        let cachedData = null;

        document.addEventListener('DOMContentLoaded', () => {
            fetchLogs();
            fetchStatus();
            fetchUART();
            resetIdleTimer();
        });

        function switchList(mode) {
            currentViewMode = mode;
            
            // Update buttons
            const btnCurrent = document.getElementById('btn-current-list');
            const btnHistory = document.getElementById('btn-history-list');
            const title = document.getElementById('table-title');
            
            if(mode === 'current') {
                btnCurrent.classList.add('btn-primary');
                btnCurrent.classList.remove('btn-secondary');
                btnCurrent.style.background = ''; // reset inline style
                btnCurrent.style.color = '';
                
                btnHistory.classList.remove('btn-primary');
                btnHistory.classList.add('btn-secondary');
                btnHistory.style.background = '#e0e5f2';
                btnHistory.style.color = '#5f6c7b';
                
                title.textContent = '當前箱內列表';
            } else {
                btnHistory.classList.add('btn-primary');
                btnHistory.classList.remove('btn-secondary');
                btnHistory.style.background = '';
                btnHistory.style.color = '';

                btnCurrent.classList.remove('btn-primary');
                btnCurrent.classList.add('btn-secondary');
                btnCurrent.style.background = '#e0e5f2';
                btnCurrent.style.color = '#5f6c7b';
                
                title.textContent = '歷史還書列表';
            }
            
            if(cachedData) renderLogs(cachedData);
        }

        // Auto Logout
        let idleTimer;
        const IDLE_TIMEOUT = 5 * 60 * 1000; // 5 minutes

        function resetIdleTimer() {
            clearTimeout(idleTimer);
            idleTimer = setTimeout(logout, IDLE_TIMEOUT);
        }

        function logout() {
            window.location.href = '/logout';
        }

        document.addEventListener('mousemove', resetIdleTimer);
        document.addEventListener('keydown', resetIdleTimer);
        document.addEventListener('click', resetIdleTimer);
        document.addEventListener('scroll', resetIdleTimer);

        // Auto Refresh
        setInterval(() => { 
            if(document.getElementById('view-dashboard').style.display !== 'none') {
                fetchLogs(); 
                fetchStatus();
            }
        }, 30000);

        // --- Logic Functions (Same as before, adapted for new UI) ---

        async function fetchStatus() {
            try {
                const res = await fetch('/api/status');
                if (!res.ok) return;
                const data = await res.json();
                const limitEl = document.getElementById('total-limit');
                if (limitEl && data.limit !== undefined) limitEl.textContent = data.limit;
            } catch (e) { console.error(e); }
        }

        async function fetchLogs() {
            try {
                const response = await fetch('/api/admin/logs');
                if (response.status === 401) {
                    window.location.href = '/login';
                    return;
                }
                const logs = await response.json();
                renderLogs(logs);
                fetchStatus();
            } catch (error) { console.error(error); }
        }

        function renderLogs(data) {
            cachedData = data;
            
            // Backwards compatibility check
            let currentLogs = [];
            let historyLogs = [];
            
            if (Array.isArray(data)) {
                // If data is just array, assume old format (current logs only)
                currentLogs = data;
            } else {
                currentLogs = data.logs || [];
                historyLogs = data.history_logs || [];
            }
            
            // Decide which list to show
            const displayLogs = currentViewMode === 'current' ? currentLogs : historyLogs;

            const tbody = document.getElementById('logs-body');
            const emptyMsg = document.getElementById('empty-message');
            const totalCount = document.getElementById('total-count');
            const todayTotal = document.getElementById('today-total');
            
            tbody.innerHTML = '';
            
            // Stats always reflect CURRENT BOX count
            if (totalCount) totalCount.textContent = currentLogs.length;
            
            if (todayTotal) {
                if (data.today_total !== undefined) {
                    todayTotal.textContent = data.today_total;
                } else {
                    // Fallback calculation from logs if server doesn't provide it
                    const todayStr = new Date().toISOString().split('T')[0];
                    const todayCount = currentLogs.filter(l => l.return_time.startsWith(todayStr)).length;
                    todayTotal.textContent = todayCount;
                }
            }

            if (displayLogs.length === 0) {
                emptyMsg.style.display = 'block';
                emptyMsg.querySelector('p').textContent = currentViewMode === 'current' ? '目前箱內無書籍' : '尚無歷史紀錄';
            } else {
                emptyMsg.style.display = 'none';
            }

            // Update table header based on mode
            const statusHeader = document.getElementById('header-status-or-clear-time');
            if (currentViewMode === 'history') {
                statusHeader.textContent = '取出時間';
            } else {
                statusHeader.textContent = '狀態';
            }

            displayLogs.forEach(log => {
                const tr = document.createElement('tr');
                
                let lastColumnContent = '';
                if (currentViewMode === 'current') {
                    lastColumnContent = '<span class="status-badge">已入箱</span>';
                } else {
                    // For history, show clear_time if available, else show badge
                    if (log.clear_time) {
                        lastColumnContent = `<span style="color:var(--text-secondary); font-size:13px;">${log.clear_time}</span>`;
                    } else {
                        lastColumnContent = '<span class="status-badge" style="background:rgba(163, 174, 208, 0.1); color:#a3aed0;">已取出</span>';
                    }
                }

                tr.innerHTML = `
                    <td>#${log.id}</td>
                    <td style="display:flex; align-items:center; gap:12px;">
                        <img src="${log.image_url}" class="book-img" alt="Cover">
                        <span style="font-weight:500;">${log.title}</span>
                    </td>
                    <td><span style="font-family:monospace; background:#f4f7f6; padding:4px 8px; border-radius:6px;">${log.book_id}</span></td>
                    <td>${log.return_time}</td>
                    <td>${lastColumnContent}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function clearHistory() {
            if (!confirm('確定要清空所有還書紀錄嗎？')) return;
            showLoading(true);
            try {
                const res = await fetch('/api/admin/clear_history', { method: 'POST' });
                const json = await res.json();
                if(json.success) {
                    alert('紀錄已清空');
                    fetchLogs();
                } else alert('失敗');
            } catch(e) { alert('Error'); }
            showLoading(false);
        }

        async function clearBox() {
            if (!confirm('確定要清空還書箱內容物嗎？')) return;
            showLoading(true);
            try {
                const res = await fetch('/api/admin/clear_box', { method: 'POST' });
                const json = await res.json();
                if(json.success) {
                    alert('已清空內容物');
                    fetchLogs();
                } else alert('失敗');
            } catch(e) { alert('Error'); }
            showLoading(false);
        }

        // Machine Command
        async function sendMachineCommand(cmd) {
            const respEl = document.getElementById('machine-response');
            respEl.value += `\n> Sending: ${cmd}...`;
            respEl.scrollTop = respEl.scrollHeight;

            try {
                const res = await fetch('/api/admin/send_command', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ cmd })
                });
                
                if (res.status === 401) {
                    window.location.href = '/login';
                    return;
                }

                const j = await res.json().catch(() => ({}));
                const time = new Date().toLocaleTimeString();
                
                if (j.success) {
                    respEl.value += `\n[${time}] RECV: ${j.response || 'OK'}`;
                } else {
                    respEl.value += `\n[${time}] ERROR: ${j.message}`;
                }
                respEl.scrollTop = respEl.scrollHeight;
            } catch (e) {
                respEl.value += `\nEXCEPTION: ${e}`;
            }
        }

        function sendCustom() {
            const cmd = document.getElementById('custom-cmd').value.trim();
            if(cmd) {
                sendMachineCommand(cmd);
                document.getElementById('custom-cmd').value = '';
            }
        }

        // Settings
        async function fetchUART() {
            try {
                const res = await fetch('/api/admin/get_uart');
                if(!res.ok) return;
                const data = await res.json();
                if(data.success && data.uart) {
                    document.getElementById('uart-port').value = data.uart.port || '';
                    document.getElementById('uart-baud').value = data.uart.baudrate || '';
                }
            } catch(e) {}
        }

        async function saveSettings() {
            showLoading(true);
            const limit = parseInt(document.getElementById('settings-limit').value);
            const port = document.getElementById('uart-port').value;
            const baud = parseInt(document.getElementById('uart-baud').value);

            try {
                await fetch('/api/admin/set_limit', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ limit })
                });
                
                await fetch('/api/admin/set_uart', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ port, baudrate: baud })
                });
                
                alert('設定已儲存');
                fetchStatus();
            } catch(e) { alert('儲存失敗'); }
            showLoading(false);
        }

        function showLoading(show) {
            document.getElementById('loading-overlay').style.display = show ? 'flex' : 'none';
        }
    </script>
</body>
</html>
